apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels: {app.kubernetes.io/name: {{ .Chart.Name }}, app.kubernetes.io/instance: {{ .Release.Name }}}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels: {app.kubernetes.io/instance: {{ .Release.Name }}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: {{ .Chart.Name }}, app.kubernetes.io/instance: {{ .Release.Name }}}
    spec:
      imagePullSecrets: {{ toYaml .Values.imagePullSecrets | nindent 8 }}
      containers:
        - name: app
          # pinned by digest: every site runs exactly the released image
          image: "{{ .Values.image.repository }}@{{ required "image.digest must be set (sha256:...)" .Values.image.digest }}"
          ports: [{containerPort: {{ .Values.service.port }}}]
          resources: {{ toYaml .Values.resources | nindent 12 }}
          {{- with .Values.site }}
          env:
            {{- range $k, $v := . }}
            - {name: {{ $k | upper }}, value: {{ $v | quote }}}
            {{- end }}
          {{- end }}
