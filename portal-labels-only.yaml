# Guards for ServiceAccount oran-apps-portal (RBAC alone cannot restrict content).
# 1) Enforces "patch managedclusters, labels only" for the portal ServiceAccount (RBAC alone cannot).
# The portal may only add/remove app.oran/* labels and set the clusterset label to telco-sites.
# Anything else it sends to a ManagedCluster is denied by the API server.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata: {name: oran-apps-portal-labels-only}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [cluster.open-cluster-management.io]
        apiVersions: ["*"]
        operations: [UPDATE]          # create/delete are not in the portal's RBAC at all
        resources: [managedclusters]
  matchConditions:
    - name: only-the-portal
      expression: request.userInfo.username == "system:serviceaccount:oran-baremetal:oran-apps-portal"
  variables:
    - name: newLabels
      expression: "has(object.metadata.labels) ? object.metadata.labels : {}"
    - name: oldLabels
      expression: "has(oldObject.metadata.labels) ? oldObject.metadata.labels : {}"
    - name: setKey
      expression: "'cluster.open-cluster-management.io/clusterset'"
  validations:
    - expression: object.spec == oldObject.spec
      message: the portal may change labels only (spec changed)
    - expression: >-
        (has(object.metadata.annotations) ? object.metadata.annotations : {}) ==
        (has(oldObject.metadata.annotations) ? oldObject.metadata.annotations : {})
      message: the portal may change labels only (annotations changed)
    - expression: >-
        variables.newLabels.all(k, k.startsWith('app.oran/') || k == variables.setKey ||
          (k in variables.oldLabels && variables.oldLabels[k] == variables.newLabels[k]))
      message: the portal may only add app.oran/* labels or the clusterset label
    - expression: >-
        variables.oldLabels.all(k, k.startsWith('app.oran/') || k in variables.newLabels)
      message: the portal may only remove app.oran/* labels
    - expression: >-
        !(variables.setKey in variables.newLabels) ||
        variables.newLabels[variables.setKey] == 'telco-sites' ||
        (variables.setKey in variables.oldLabels && variables.oldLabels[variables.setKey] == variables.newLabels[variables.setKey])
      message: the portal may only move a cluster into cluster set telco-sites
    - expression: >-
        variables.newLabels.all(k, !k.startsWith('app.oran/') || variables.newLabels[k] == 'enabled')
      message: app.oran/* labels must have the value enabled
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata: {name: oran-apps-portal-labels-only}
spec:
  policyName: oran-apps-portal-labels-only
  validationActions: [Deny]
---
# The portal may create/update/delete only the per-app objects it renders: labelled app.oran/app,
# ApplicationSets in project telco-apps with a single RHACM placement generator (no templatePatch,
# no multi-source), Placements limited to cluster set telco-sites.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata: {name: oran-apps-portal-gitops-objects}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [argoproj.io]
        apiVersions: ["*"]
        operations: [CREATE, UPDATE, DELETE]
        resources: [applicationsets]
      - apiGroups: [cluster.open-cluster-management.io]
        apiVersions: ["*"]
        operations: [CREATE, UPDATE, DELETE]
        resources: [placements]
  matchConditions:
    - name: only-the-portal
      expression: request.userInfo.username == "system:serviceaccount:oran-baremetal:oran-apps-portal"
  variables:
    - name: obj
      expression: "request.operation == 'DELETE' ? oldObject : object"
  validations:
    - expression: "has(variables.obj.metadata.labels) && 'app.oran/app' in variables.obj.metadata.labels"
      message: the portal may only manage objects labelled app.oran/app
    - expression: >-
        request.operation == 'DELETE' || variables.obj.kind != 'ApplicationSet' ||
        (variables.obj.spec.template.spec.project == 'telco-apps' &&
         !has(variables.obj.spec.templatePatch) &&
         !has(variables.obj.spec.template.spec.sources) &&
         variables.obj.spec.generators.size() == 1 &&
         variables.obj.spec.generators.all(g, has(g.clusterDecisionResource) &&
           !has(g.list) && !has(g.clusters) && !has(g.git) && !has(g.matrix) && !has(g.merge) &&
           !has(g.scmProvider) && !has(g.pullRequest) && !has(g.plugin)))
      message: ApplicationSet must use project telco-apps and only the RHACM placement generator
    - expression: >-
        request.operation == 'DELETE' || variables.obj.kind != 'Placement' ||
        variables.obj.spec.clusterSets == ['telco-sites']
      message: Placement must select cluster set telco-sites only
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata: {name: oran-apps-portal-gitops-objects}
spec:
  policyName: oran-apps-portal-gitops-objects
  validationActions: [Deny]
---
# 3) Credentials from Settings: the portal may only replace the token / registry login inside the two
#    secrets; type, labels, keys, and the Argo CD url/username/type fields must stay as created.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata: {name: oran-apps-portal-credentials}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: [UPDATE]
        resources: [secrets]
  matchConditions:
    - name: only-the-portal
      expression: request.userInfo.username == "system:serviceaccount:oran-baremetal:oran-apps-portal"
  variables:
    - name: newL
      expression: "has(object.metadata.labels) ? object.metadata.labels : {}"
    - name: oldL
      expression: "has(oldObject.metadata.labels) ? oldObject.metadata.labels : {}"
    - name: st
      expression: "'argocd.argoproj.io/secret-type'"
  validations:
    - expression: >-
        variables.newL.all(k, k == variables.st || (k in variables.oldL && variables.oldL[k] == variables.newL[k])) &&
        variables.oldL.all(k, k == variables.st || k in variables.newL)
      message: labels must not change
    - expression: >-
        !(variables.st in variables.newL) || variables.newL[variables.st] == 'repo-creds' ||
        (variables.st in variables.oldL && variables.oldL[variables.st] == variables.newL[variables.st])
      message: the portal may only activate the credential (secret-type repo-creds)
    - expression: object.type == oldObject.type
      message: secret type must not change
    - expression: >-
        has(object.data) && has(oldObject.data) &&
        oldObject.data.all(k, k in object.data) && object.data.all(k, k in oldObject.data)
      message: secret keys must not change
    - expression: >-
        object.metadata.name != 'telco-apps-github' ||
        ['type', 'url', 'username'].all(k, object.data[k] == oldObject.data[k])
      message: only the token (password) may change in telco-apps-github
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata: {name: oran-apps-portal-credentials}
spec:
  policyName: oran-apps-portal-credentials
  validationActions: [Deny]
---
# 4) Registry host list from Settings: only data.hosts, labels unchanged.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata: {name: oran-apps-portal-registry-list}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: [UPDATE]
        resources: [configmaps]
  matchConditions:
    - name: only-the-portal
      expression: request.userInfo.username == "system:serviceaccount:oran-baremetal:oran-apps-portal"
  validations:
    - expression: >-
        (has(object.metadata.labels) ? object.metadata.labels : {}) ==
        (has(oldObject.metadata.labels) ? oldObject.metadata.labels : {})
      message: labels must not change
    - expression: has(object.data) && object.data.size() == 1 && 'hosts' in object.data
      message: telco-registries may only hold the hosts list
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata: {name: oran-apps-portal-registry-list}
spec:
  policyName: oran-apps-portal-registry-list
  validationActions: [Deny]
