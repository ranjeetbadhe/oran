# Hub ServiceAccount for the portal's "Deploy applications" screen. Least privilege, no cluster-admin.
#   read : managedclusters, applications, applicationsets, placements, placementdecisions, policies
#   write: patch managedclusters (labels only - enforced by portal-labels-only.yaml)
#          create/patch/delete ApplicationSets + Placements in openshift-gitops, only the shape the portal
#          renders (project telco-apps, RHACM placement generator, cluster set telco-sites) - also enforced there
#          update the credentials uploaded in Settings: patch ONLY secrets telco-apps-github (openshift-gitops)
#          and private-registry (rhacm-policies) + configmap telco-registries. No get: write-only, never read back.
#          + join cluster set telco-sites (needed when "Mark provisioned" adds the clusterset label;
#            RHACM's webhook refuses that label change without managedclustersets/join on the set)
apiVersion: v1
kind: ServiceAccount
metadata: {name: oran-apps-portal, namespace: oran-baremetal}
---
apiVersion: v1
kind: Secret
metadata:
  name: oran-apps-portal-token
  namespace: oran-baremetal
  annotations: {kubernetes.io/service-account.name: oran-apps-portal}
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: oran-apps-portal}
rules:
  - apiGroups: [cluster.open-cluster-management.io]
    resources: [managedclusters]
    verbs: [get, list, watch, patch]
  - apiGroups: [cluster.open-cluster-management.io]
    resources: [managedclustersets/join]
    resourceNames: [telco-sites]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: oran-apps-portal}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: oran-apps-portal}
subjects: [{kind: ServiceAccount, name: oran-apps-portal, namespace: oran-baremetal}]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: oran-apps-portal-read, namespace: openshift-gitops}
rules:
  - apiGroups: [argoproj.io]
    resources: [applications, applicationsets]
    verbs: [get, list, watch]
  - apiGroups: [cluster.open-cluster-management.io]
    resources: [placements, placementdecisions]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [telco-registries]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: oran-apps-portal-onboard, namespace: openshift-gitops}
rules:
  - apiGroups: [argoproj.io]
    resources: [applicationsets]
    verbs: [create, patch, delete]
  - apiGroups: [cluster.open-cluster-management.io]
    resources: [placements]
    verbs: [create, patch, delete]
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [telco-apps-github]
    verbs: [patch]
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [telco-registries]
    verbs: [patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: oran-apps-portal-onboard, namespace: openshift-gitops}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: oran-apps-portal-onboard}
subjects: [{kind: ServiceAccount, name: oran-apps-portal, namespace: oran-baremetal}]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: oran-apps-portal-read, namespace: openshift-gitops}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: oran-apps-portal-read}
subjects: [{kind: ServiceAccount, name: oran-apps-portal, namespace: oran-baremetal}]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: oran-apps-portal-read, namespace: rhacm-policies}
rules:
  - apiGroups: [policy.open-cluster-management.io]
    resources: [policies]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: oran-apps-portal-read, namespace: rhacm-policies}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: oran-apps-portal-read}
subjects: [{kind: ServiceAccount, name: oran-apps-portal, namespace: oran-baremetal}]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: oran-apps-portal-registry, namespace: rhacm-policies}
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [private-registry]
    verbs: [patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: oran-apps-portal-registry, namespace: rhacm-policies}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: oran-apps-portal-registry}
subjects: [{kind: ServiceAccount, name: oran-apps-portal, namespace: oran-baremetal}]
